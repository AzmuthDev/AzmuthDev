<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" role="img" aria-label="Eduardo Ramos - Full Stack Developer and Automation Expert">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040705"/>
      <stop offset=".6" stop-color="#07130b"/>
      <stop offset="1" stop-color="#0c2414"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2fff5"/>
      <stop offset=".55" stop-color="#b8ffc8"/>
      <stop offset="1" stop-color="#39ff5a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39ff5a"/>
      <stop offset="1" stop-color="#39ff5a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#39ff5a" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#39ff5a" stop-opacity=".12"/>
      <stop offset="1" stop-color="#39ff5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#0f2a16"/>
      <stop offset="1" stop-color="#030604"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#39ff5a" stroke-opacity=".07"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1000" height="320" fill="url(#fade)"/></mask>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1000" height="320" rx="20"/></clipPath>
  </defs>

  <style>
    .mono{font-family:'Cascadia Code','Fira Code',Consolas,'Courier New',monospace}
    .sans{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
    .name{font-size:64px;font-weight:800;fill:url(#title);letter-spacing:-.5px}
    .role{font-size:19px;font-weight:600;fill:#9dffb2;letter-spacing:4px}
    .tag{font-size:14px;fill:#5f8a6b;letter-spacing:3px}
    .chip{font-size:13px;fill:#c9ffd4;letter-spacing:1px}
    .in{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
    .d1{animation-delay:.15s}.d2{animation-delay:.4s}.d3{animation-delay:.65s}.d4{animation-delay:.9s}
    .spin{transform-origin:830px 160px;animation:spin 20s linear infinite}
    .spinR{transform-origin:830px 160px;animation:spin 34s linear infinite reverse}
    .pulse{animation:pulse 2.8s ease-in-out infinite}
    .scan{animation:scan 7s linear infinite}
    .blink{animation:blink 1s steps(1) infinite}
    .grow{transform-origin:60px 0;transform:scaleX(0);animation:grow 1.2s .9s cubic-bezier(.2,.8,.2,1) forwards}
    .p{animation:float 6s linear infinite}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
    @keyframes scan{from{transform:translateY(-10px)}to{transform:translateY(330px)}}
    @keyframes blink{50%{opacity:0}}
    @keyframes grow{to{transform:scaleX(1)}}
    @keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-140px);opacity:0}}
  </style>

  <g clip-path="url(#round)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)" mask="url(#gridMask)"/>
    <rect class="scan" width="1000" height="2" fill="#39ff5a" opacity=".1"/>

    <!-- particles -->
    <g fill="#39ff5a">
      <circle class="p" cx="700" cy="300" r="1.6" style="animation-delay:0s"/>
      <circle class="p" cx="760" cy="310" r="1.2" style="animation-delay:1.5s"/>
      <circle class="p" cx="900" cy="305" r="1.8" style="animation-delay:.8s"/>
      <circle class="p" cx="955" cy="295" r="1.1" style="animation-delay:3s"/>
      <circle class="p" cx="640" cy="315" r="1.3" style="animation-delay:4.2s"/>
      <circle class="p" cx="860" cy="318" r="1.4" style="animation-delay:2.4s"/>
    </g>

    <!-- Omnitrix dial -->
    <circle cx="830" cy="160" r="200" fill="url(#glow)" class="pulse"/>
    <g class="spinR" fill="none" stroke="#39ff5a" stroke-opacity=".3">
      <circle cx="830" cy="160" r="132" stroke-dasharray="2 10"/>
    </g>
    <g class="spin" fill="none" stroke="#39ff5a" stroke-width="3" stroke-opacity=".85" stroke-linecap="round">
      <circle cx="830" cy="160" r="112" stroke-dasharray="70 18 6 18"/>
    </g>
    <circle cx="830" cy="160" r="94" fill="#0a0f0b" stroke="#2a3a2e" stroke-width="10"/>
    <g fill="#39ff5a" opacity=".9">
      <rect x="826" y="62" width="8" height="12" rx="2"/>
      <rect x="826" y="246" width="8" height="12" rx="2"/>
      <rect x="732" y="156" width="12" height="8" rx="2"/>
      <rect x="916" y="156" width="12" height="8" rx="2"/>
    </g>
    <circle cx="830" cy="160" r="82" fill="url(#core)" stroke="#39ff5a" stroke-width="3"/>
    <g class="pulse" filter="url(#neon)">
      <path d="M792 118H868L838 160L868 202H792L822 160Z" fill="#39ff5a"/>
    </g>
    <path d="M792 118H868L838 160L868 202H792L822 160Z" fill="none" stroke="#eafff0" stroke-width="1.5" stroke-opacity=".8"/>

    <!-- text -->
    <text x="60" y="92" class="mono tag in d1">&gt; HELLO, WORLD — I AM</text>
    <text x="56" y="160" class="sans name in d2">Eduardo Ramos</text>
    <text x="60" y="200" class="mono role in d3">FULL STACK DEV <tspan fill="#39ff5a">//</tspan> AUTOMATION EXPERT<tspan class="blink" fill="#39ff5a">█</tspan></text>
    <rect x="60" y="220" width="320" height="3" rx="1.5" fill="url(#bar)" class="grow"/>

    <g class="in d4">
      <g transform="translate(60 244)">
        <rect width="62" height="28" rx="14" fill="#39ff5a" fill-opacity=".08" stroke="#39ff5a" stroke-opacity=".45"/>
        <text x="31" y="19" text-anchor="middle" class="mono chip">n8n</text>
      </g>
      <g transform="translate(132 244)">
        <rect width="104" height="28" rx="14" fill="#39ff5a" fill-opacity=".08" stroke="#39ff5a" stroke-opacity=".45"/>
        <text x="52" y="19" text-anchor="middle" class="mono chip">AI Agents</text>
      </g>
      <g transform="translate(246 244)">
        <rect width="98" height="28" rx="14" fill="#39ff5a" fill-opacity=".08" stroke="#39ff5a" stroke-opacity=".45"/>
        <text x="49" y="19" text-anchor="middle" class="mono chip">Supabase</text>
      </g>
      <g transform="translate(354 244)">
        <rect width="112" height="28" rx="14" fill="#39ff5a" fill-opacity=".08" stroke="#39ff5a" stroke-opacity=".45"/>
        <text x="56" y="19" text-anchor="middle" class="mono chip">TypeScript</text>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="998" height="318" rx="19.5" fill="none" stroke="#39ff5a" stroke-opacity=".3"/>
</svg>
