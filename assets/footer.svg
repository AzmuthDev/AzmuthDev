<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" role="img" aria-label="It's hero time">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39ff5a" stop-opacity="0"/>
      <stop offset="1" stop-color="#39ff5a" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39ff5a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#39ff5a"/>
      <stop offset="1" stop-color="#39ff5a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .w1{animation:wave 8s ease-in-out infinite alternate}
    .w2{animation:wave 11s ease-in-out infinite alternate-reverse}
    .t{font:600 15px 'Cascadia Code','Fira Code',Consolas,monospace;fill:#39ff5a;letter-spacing:6px}
    .pulse{animation:pulse 2.8s ease-in-out infinite}
    @keyframes wave{from{transform:translateX(0)}to{transform:translateX(-80px)}}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  </style>
  <path class="w1" d="M0 80 C120 55 240 105 360 80 S600 55 720 80 S960 105 1080 80 V120 H0Z" fill="url(#fbg)"/>
  <path class="w2" d="M0 90 C140 110 260 70 400 90 S660 110 800 90 S1000 70 1100 90 V120 H0Z" fill="url(#fbg)"/>
  <rect x="150" y="40" width="700" height="1" fill="url(#line)"/>
  <g class="pulse" transform="translate(500 40)">
    <circle r="15" fill="#050906" stroke="#39ff5a" stroke-width="2"/>
    <path d="M-7 -8H7L1.5 0L7 8H-7L-1.5 0Z" fill="#39ff5a"/>
  </g>
  <text x="500" y="86" text-anchor="middle" class="t">IT'S HERO TIME</text>
</svg>
